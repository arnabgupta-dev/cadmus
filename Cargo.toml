[package]
name = "cadmus"
version = "0.1.5"
edition = "2024"
description = "A batteries-included web framework for Rust: models, admin site, REST API, migrations and accounts, on axum and SeaORM"
license = "MIT"
repository = "https://github.com/arnabgupta-dev/cadmus"
homepage = "https://arnabgupta-dev.github.io/cadmus/"
documentation = "https://docs.rs/cadmus"
readme = "README.md"
keywords = ["web", "framework", "admin", "rest", "axum"]
categories = ["web-programming", "web-programming::http-server", "database"]
# CI settings are for this repository only.
exclude = [".github/", "mcp/"]

[package.metadata.docs.rs]
# Document the S3, Azure and Google Cloud storage support too.
all-features = true

[features]
# Every driver is built in, so the database is chosen by `database.url` alone. Projects that
# use one database can keep only its driver with `default-features = false`.
default = ["sqlite", "postgres", "mysql"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm/runtime-tokio-rustls"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm/runtime-tokio-rustls"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm/runtime-tokio-rustls"]
s3 = ["object_store/aws"]
azure = ["object_store/azure"]
gcs = ["object_store/gcp"]

[dependencies]
# Cleans the HTML of rich-text fields before it is stored.
ammonia = "4.2.5"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base32 = "0.5.1"
base64 = "0.22"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
minijinja = { version = "3", features = ["serde", "urlencode"] }
object_store = "0.14.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10.3"
# Talks to Google, Facebook and the other login providers. TLS uses `ring`, which the
# database driver already brings, rather than a second crypto library.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-json", "with-chrono", "with-uuid", "with-rust_decimal", "postgres-array", "schema-sync"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps columns and API operations in the order they are declared.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "signal", "rt", "sync", "time"] }
# Compression is for REST API responses only; see `server::compressible`.
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace]
members = ["cli", "site"]
