[package]
name = "heraapi"
version = "0.1.0"
edition = "2024"
description = "Django-style admin, REST API, auth and file uploads for axum and SeaORM"
license = "MIT"
repository = "https://github.com/arnabgupta-dev/heraapi"
readme = "README.md"
keywords = ["axum", "sea-orm", "admin", "rest", "crud"]
categories = ["web-programming", "web-programming::http-server", "database"]

[features]
default = ["sqlite"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm/runtime-tokio-rustls"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm/runtime-tokio-rustls"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm/runtime-tokio-rustls"]
s3 = ["object_store/aws"]
azure = ["object_store/azure"]
gcs = ["object_store/gcp"]

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base32 = "0.5.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
minijinja = { version = "3", features = ["serde", "urlencode"] }
object_store = "0.14.2"
rand = "0.10.3"
rpassword = "7.5.5"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-json", "with-chrono", "schema-sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "signal", "rt"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace]
members = ["cli"]
