name: Suggestion
description: An idea, a missing feature, or something that could be easier.
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: Every idea is welcome, big or small.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Cadmus to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What you're trying to build, and what gets in the way today.
  - type: textarea
    id: example
    attributes:
      label: What might it look like?
      description: Optional. A code sketch, a command, or a screenshot from another tool.
